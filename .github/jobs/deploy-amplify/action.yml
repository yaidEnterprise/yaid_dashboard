name: "Deploy Amplify"
description: >-
  Composite action que publica o app Next.js SSR no AWS Amplify Hosting como o
  passo de deploy do app no release de produção (Epic 11), DEPOIS das migrations
  (deploy-supabase, Story 11.4) e ANTES do smoke-test (Story 11.6). Autentica na
  AWS via `aws-actions/configure-aws-credentials` com assunção de role
  (`sts:AssumeRole`, pois OIDC está indisponível), sincroniza as env vars para o
  branch Amplify de forma AUTORITATIVA (nomes derivados do `.env.local.example`,
  valores resolvidos por colocação em Secrets/Variables do GitHub, replace total
  via `update-branch`), dispara o deploy via `aws amplify start-job --job-type
  RELEASE` e faz polling finito (com timeout) até um estado terminal, falhando em
  qualquer estado ≠ SUCCEED.

# SEGURANÇA (§4-D e §5.7 da sprint change proposal 2026-08-08; Story 11.8):
# Este composite consome SECRETS (credenciais bootstrap AWS, ARN do role de
# deploy, app-id e os payloads JSON de Variables/Secrets do GitHub) e o nome do
# branch via `github.ref_name` (não é secret — sempre igual ao branch da
# pipeline). Eles
# entram EXCLUSIVAMENTE via `inputs` (passados pelo orquestrador `production.yml`
# a partir de `${{ secrets.* }}` / `${{ toJSON(vars) }}` / `${{ toJSON(secrets) }}`)
# — NUNCA hardcoded neste arquivo — e são expostos aos comandos apenas via `env:`
# ou pelas entradas da action, NUNCA ecoados nos logs (nada de
# `echo`/`cat`/`printenv` de credenciais ou env vars sensíveis). Nenhum secret
# server-side é transformado em `NEXT_PUBLIC_*`.
#
# SYNC AUTORITATIVO DE ENV VARS (Story 11.8 — reverte o modelo de MERGE da §5.4
# da proposta 2026-08-08): a lista de NOMES vem do `.env.local.example` (fonte
# única de verdade de QUAIS variáveis existem — ignora comentários/linhas
# vazias). Para cada nome, o VALOR é resolvido primeiro em Secrets do GitHub,
# senão em Variables (a colocação no GitHub decide Secret vs Variable — sem
# classificação hardcoded aqui). Um nome sem valor em nenhum dos dois é omitido
# do payload. O mapa resolvido é enviado via `aws amplify update-branch
# --cli-input-json` como REPLACE total do branch — sem `get-branch`/merge. Isso é
# seguro porque, neste modelo, toda env var usada pela app tem origem no GitHub
# (Variables/Secrets); nenhuma variável server-side vive apenas no console do
# Amplify — logo nada é apagado sem ser reprovisionado no mesmo passo.
#
# §5.7 (IAM least-privilege): as credenciais bootstrap só têm `sts:AssumeRole`;
# o deploy role assumido só tem `amplify:StartJob/GetJob/GetBranch/UpdateBranch/
# ListJobs` no ARN do app (o JSON das policies é documentado na Story 11.7). Esta
# story WIRA o uso do assume-role via `role-to-assume`.
#
# §5.8 CRÍTICO (polling finito): o wait do job Amplify tem timeout / número máximo
# de tentativas (loop finito) e falha explicitamente (exit não-zero) em qualquer
# estado terminal diferente de SUCCEED (FAILED/CANCELLED) e no estouro do timeout.

inputs:
  aws-access-key-id:
    description: >-
      Access key ID das credenciais bootstrap do IAM User (que só possui
      `sts:AssumeRole`). Passado via o secret `secrets.AWS_ACCESS_KEY_ID`. Nunca
      hardcoded, nunca ecoado.
    required: true
  aws-secret-access-key:
    description: >-
      Secret access key das credenciais bootstrap do IAM User. Passado via
      o secret `secrets.AWS_SECRET_ACCESS_KEY`. Nunca hardcoded, nunca ecoado.
    required: true
  aws-region:
    description: >-
      Região AWS do app Amplify (ex.: us-east-1). Passada via
      o secret `secrets.AWS_REGION` (ou variable). Nunca hardcoded.
    required: true
  aws-role-to-assume:
    description: >-
      ARN do IAM Role de deploy a ser assumido via `sts:AssumeRole` (least-
      privilege: apenas ações do Amplify no ARN do app). Passado via
      o secret `secrets.AWS_DEPLOY_ROLE_ARN`. Nunca hardcoded.
    required: true
  amplify-app-id:
    description: >-
      ID do app no AWS Amplify. Passado via o secret `secrets.AMPLIFY_APP_ID`.
      Nunca hardcoded.
    required: true
  amplify-branch-name:
    description: >-
      Nome do branch do Amplify a publicar (ex.: prod). Passado via
      o contexto `github.ref_name` — o branch que disparou o workflow, não um
      secret (é sempre igual ao branch da pipeline, nunca configurado à parte).
    required: true
  github-variables-json:
    description: >-
      Payload JSON (objeto {chave:valor}) com TODAS as GitHub Variables do
      repositório/environment. Passado via a expressão toJSON(vars). Usado como
      fonte de valor (segunda prioridade, depois de Secrets) para os nomes
      derivados do `.env.local.example`. Nunca hardcoded, nunca ecoado.
    required: true
  github-secrets-json:
    description: >-
      Payload JSON (objeto {chave:valor}) com TODOS os GitHub Secrets do
      repositório/environment. Passado via a expressão toJSON(secrets). Usado como
      fonte de valor (primeira prioridade) para os nomes derivados do
      `.env.local.example`. Nunca hardcoded, nunca ecoado.
    required: true

runs:
  using: "composite"
  steps:
    # AUTENTICAÇÃO (§5.7): credenciais bootstrap (só `sts:AssumeRole`) usadas para
    # ASSUMIR o deploy role via `role-to-assume`. OIDC está indisponível — daí o
    # fluxo bootstrap creds -> AssumeRole -> deploy role least-privilege.
    - name: Configura credenciais AWS (bootstrap -> AssumeRole do deploy role)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        role-session-name: yaid-deploy-amplify

    # SYNC AUTORITATIVO DE ENV VARS (Story 11.8 — replace, sem get-branch/merge):
    # (1) deriva os NOMES do `.env.local.example` (ignora comentários/linhas
    #     vazias), (2) resolve o VALOR de cada nome por colocação — primeiro em
    #     Secrets, senão em Variables — omitindo nomes sem valor em nenhum dos
    #     dois, exceto `STAGE`, que é derivado automaticamente do branch
    #     publicado (upper-case de `AMPLIFY_BRANCH_NAME`) e NUNCA consultado em
    #     Secrets/Variables — (3) envia o mapa resolvido via `update-branch`
    #     como REPLACE total do branch. Sem echo/cat das env vars sensíveis (o
    #     GitHub também mascara secrets).
    - name: Sincroniza env vars no Amplify (replace autoritativo)
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        AMPLIFY_APP_ID: ${{ inputs.amplify-app-id }}
        AMPLIFY_BRANCH_NAME: ${{ inputs.amplify-branch-name }}
        VARS_JSON: ${{ inputs.github-variables-json }}
        SECRETS_JSON: ${{ inputs.github-secrets-json }}
      run: |
        set -euo pipefail
        # (0) PRÉ-CONDIÇÃO: o .env.local.example precisa existir e não estar
        #     vazio — sem ele não há lista de nomes a sincronizar. Falha com
        #     mensagem explícita em vez de deixar o `grep` do passo (1) abortar
        #     com stderr cru sob `pipefail` (review finding — Story 11.8).
        env_example="${GITHUB_WORKSPACE}/.env.local.example"
        if [ ! -s "$env_example" ]; then
          echo "::error::.env.local.example ausente ou vazio em $env_example — sync abortado."
          exit 1
        fi
        # (1) NOMES: derivados do .env.local.example (na raiz do repo checado
        #     pelo orquestrador), ignorando comentários e linhas vazias. O
        #     `|| true` evita que `grep` sem nenhum match (ex.: arquivo só com
        #     comentários) aborte o step sob `pipefail` (review finding).
        names="$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' "$env_example" || true)"
        names="$(sed -E 's/=.*//; s/[[:space:]]//g' <<<"$names")"
        if [ -z "$names" ]; then
          echo "::error::Nenhum nome de env var derivado de .env.local.example — sync abortado."
          exit 1
        fi
        # (2) VALORES: por nome, Secrets tem prioridade sobre Variables; nomes
        #     sem valor em nenhum dos dois são omitidos do payload. Defesa em
        #     profundidade (review finding — AC5): nomes de secrets de infra
        #     nunca devem estar no .env.local.example; se algum dia estiverem
        #     por engano, o step falha em vez de sincronizá-los ao Amplify.
        payload='{}'
        while IFS= read -r name; do
          [ -z "$name" ] && continue
          if [[ "$name" =~ ^(AWS_|AMPLIFY_)|^(SUPABASE_ACCESS_TOKEN|GITHUB_TOKEN)$ ]]; then
            echo "::error::'$name' parece um secret de infra e não deve estar em .env.local.example — sync abortado."
            exit 1
          fi
          # STAGE é derivado do branch publicado, não de Secrets/Variables: o
          # branch que dispara o release JÁ determina o stage (esta pipeline só
          # roda em `prod`, então STAGE=PROD sempre) — não é algo configurável à
          # parte, então nunca consulta SECRETS_JSON/VARS_JSON para este nome.
          if [ "$name" = "STAGE" ]; then
            value="$(tr '[:lower:]' '[:upper:]' <<<"$AMPLIFY_BRANCH_NAME")"
            payload="$(jq --arg n "$name" --arg v "$value" '. + {($n): $v}' <<<"$payload")"
            continue
          fi
          value="$(jq -r --arg n "$name" '.[$n] // empty' <<<"$SECRETS_JSON")"
          if [ -z "$value" ]; then
            value="$(jq -r --arg n "$name" '.[$n] // empty' <<<"$VARS_JSON")"
          fi
          [ -z "$value" ] && continue
          payload="$(jq --arg n "$name" --arg v "$value" '. + {($n): $v}' <<<"$payload")"
        done <<<"$names"
        # (3) GUARDA: um payload vazio indicaria checkout incorreto, JSON de
        #     Secrets/Variables vazio, ou nenhum nome resolvido — recusa o
        #     REPLACE em vez de apagar silenciosamente todas as env vars do
        #     branch (review finding — Story 11.8).
        if [ "$(jq 'length' <<<"$payload")" -eq 0 ]; then
          echo "::error::Nenhuma env var resolvida — recusando o replace autoritativo (evita apagar o branch)."
          exit 1
        fi
        # (4) REPLACE autoritativo: envia SOMENTE o mapa resolvido a partir do
        #     .env.local.example — sem ler/mesclar o estado atual do branch.
        #     Payload via --cli-input-json evita escrever secrets em disco ou
        #     nos logs.
        aws amplify update-branch --cli-input-json "$(jq -n \
          --arg app "$AMPLIFY_APP_ID" \
          --arg branch "$AMPLIFY_BRANCH_NAME" \
          --argjson env "$payload" \
          '{appId: $app, branchName: $branch, environmentVariables: $env}')"

    # DEPLOY (§4-B): dispara o job de RELEASE. O auto-build do Amplify na branch
    # prod está desabilitado (Story 11.2) — o release é sempre orquestrado aqui.
    - name: Dispara deploy no Amplify (start-job RELEASE)
      id: start-job
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        AMPLIFY_APP_ID: ${{ inputs.amplify-app-id }}
        AMPLIFY_BRANCH_NAME: ${{ inputs.amplify-branch-name }}
      run: |
        set -euo pipefail
        job_id="$(aws amplify start-job \
          --app-id "$AMPLIFY_APP_ID" \
          --branch-name "$AMPLIFY_BRANCH_NAME" \
          --job-type RELEASE \
          --query 'jobSummary.jobId' \
          --output text)"
        echo "Amplify RELEASE job iniciado: $job_id"
        echo "job-id=$job_id" >> "$GITHUB_OUTPUT"

    # POLLING FINITO (§5.8): espera até estado terminal com timeout/max tentativas
    # (60 x 15s = 15 min). SUCCEED -> sucesso; FAILED/CANCELLED/inesperado/timeout
    # -> exit não-zero. Nunca um loop infinito.
    - name: Aguarda o job do Amplify (polling com timeout)
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        AMPLIFY_APP_ID: ${{ inputs.amplify-app-id }}
        AMPLIFY_BRANCH_NAME: ${{ inputs.amplify-branch-name }}
        JOB_ID: ${{ steps.start-job.outputs.job-id }}
      run: |
        set -euo pipefail
        max_attempts=60
        sleep_seconds=15
        attempt=0
        while [ "$attempt" -lt "$max_attempts" ]; do
          attempt=$((attempt + 1))
          status="$(aws amplify get-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH_NAME" \
            --job-id "$JOB_ID" \
            --query 'job.summary.status' \
            --output text)"
          echo "Tentativa $attempt/$max_attempts — status do job Amplify: $status"
          case "$status" in
            SUCCEED)
              echo "Deploy do Amplify concluído com sucesso (SUCCEED)."
              exit 0
              ;;
            FAILED|CANCELLED)
              echo "::error::Job do Amplify terminou em estado não-SUCCEED: $status"
              exit 1
              ;;
            PENDING|PROVISIONING|RUNNING)
              sleep "$sleep_seconds"
              ;;
            *)
              echo "::error::Status inesperado do job do Amplify: $status"
              exit 1
              ;;
          esac
        done
        echo "::error::Timeout aguardando o job do Amplify após $max_attempts tentativas."
        exit 1
