name: Production Release

# Orquestrador do release de produção (Epic 11, Sprint Change 2026-08-08).
# Dispara em push na branch `prod`. Gates sequenciais via `needs:`:
#   tests (11.3) -> deploy-supabase (11.4) -> deploy-amplify (11.5) -> smoke-test (11.6).
# Esta story (11.6) adiciona o job FINAL `smoke-test`, encadeado após
# `deploy-amplify` (`needs: deploy-amplify`): a validação pós-deploy (GET
# $NEXT_PUBLIC_APP_URL/api/health com retries finitos) só roda depois que o app for
# publicado no Amplify com sucesso. Com isso a cadeia completa fica
# tests -> deploy-supabase -> deploy-amplify -> smoke-test.
#
# Estrutura distribuída (§4-D): cada job vive em `.github/jobs/<nome>/action.yml`
# como composite action e é chamado por `uses: ./.github/jobs/<nome>`. Secrets são
# centralizados AQUI (no orquestrador) e passados aos composites via `with:` a
# partir de `${{ secrets.* }}` — nunca hardcoded nos composites.

# `on` escrito como string entre aspas para evitar a coerção YAML 1.1 (chave nua
# `on` -> booleano true).
"on":
  push:
    branches:
      - prod

# Least-privilege (alinha com a postura de segurança do Epic 11, §5.7): o job de
# testes só precisa ler o conteúdo do repositório (para o checkout). Sem este
# bloco, o GITHUB_TOKEN herdaria as permissões default (frequentemente amplas) do
# repositório/organização.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (gate)
    runs-on: ubuntu-latest
    steps:
      # Checkout é obrigatório ANTES de usar um composite action local:
      # `uses: ./...` só resolve depois que o repositório está no runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests composite
        uses: ./.github/jobs/tests

  # Segundo gate: aplica migrations pendentes ao Supabase Cloud. Só roda depois
  # que o job `tests` passar (`needs: tests`) — nenhum deploy acontece se a suíte
  # falhar. É o PRIMEIRO passo de infra do release, antes do deploy do app
  # (deploy-amplify, Story 11.5, que declarará `needs: deploy-supabase`).
  deploy-supabase:
    name: Deploy Supabase (migrations)
    runs-on: ubuntu-latest
    needs: tests
    # Secrets/Variables estão cadastrados no Environment do GitHub `prod`
    # (mesmo nome do branch que dispara o workflow) — sem esta declaração,
    # `secrets.*`/`vars.*` resolvem vazios para jobs fora desse environment.
    environment: prod
    steps:
      # Checkout necessário para resolver o composite local e disponibilizar as
      # migrations em `supabase/migrations/` no runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Secrets centralizados no orquestrador e passados via `with:` — nunca
      # hardcoded no composite. O composite os recebe como `inputs`.
      - name: Run deploy-supabase composite
        uses: ./.github/jobs/deploy-supabase
        with:
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase-project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase-db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Terceiro gate: publica o app Next.js SSR no AWS Amplify. Só roda depois que
  # `deploy-supabase` aplicar as migrations (`needs: deploy-supabase`) — o deploy
  # do app é o passo de infra que vem DEPOIS do banco (§4-B/NFR11: tests ->
  # deploy-supabase -> deploy-amplify -> smoke-test). O job `smoke-test`
  # (Story 11.6) é encadeado a partir daqui via `needs: deploy-amplify`.
  deploy-amplify:
    name: Deploy Amplify (app)
    runs-on: ubuntu-latest
    needs: deploy-supabase
    # Secrets/Variables estão cadastrados no Environment do GitHub `prod`
    # (mesmo nome do branch que dispara o workflow) — sem esta declaração,
    # `secrets.*`/`vars.*` resolvem vazios para jobs fora desse environment.
    environment: prod
    steps:
      # Checkout necessário para resolver o composite local `./.github/jobs/...`.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Secrets centralizados no orquestrador e passados via `with:` — nunca
      # hardcoded no composite. Autenticação bootstrap -> AssumeRole (§5.7);
      # env vars server-side sincronizadas de forma AUTORITATIVA (Story 11.8):
      # nomes derivados do `.env.local.example`, valores resolvidos por
      # colocação (Secrets -> Variables) a partir de `toJSON(vars)`/
      # `toJSON(secrets)` — replace total do branch, sem get-branch/merge.
      # `amplify-branch-name` vem de `github.ref_name` (branch que disparou o
      # workflow via `on.push.branches: [prod]`) — não é um secret, pois é
      # sempre igual ao branch da pipeline, nunca configurado à parte.
      - name: Run deploy-amplify composite
        uses: ./.github/jobs/deploy-amplify
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          amplify-app-id: ${{ secrets.AMPLIFY_APP_ID }}
          amplify-branch-name: ${{ github.ref_name }}
          github-variables-json: ${{ toJSON(vars) }}
          github-secrets-json: ${{ toJSON(secrets) }}

  # Gate FINAL: valida a aplicação publicada via health check. Só roda depois que
  # `deploy-amplify` concluir o RELEASE no Amplify (`needs: deploy-amplify`) — ou
  # seja, o Amplify já atingiu SUCCEED (Story 11.5) antes de qualquer requisição.
  # Faz GET $NEXT_PUBLIC_APP_URL/api/health (endpoint da Story 11.1) com retries finitos
  # e falha explicitamente se nunca retornar 200 (§5.8/§6). Fecha a cadeia
  # tests -> deploy-supabase -> deploy-amplify -> smoke-test.
  smoke-test:
    name: Smoke Test (health check)
    runs-on: ubuntu-latest
    needs: deploy-amplify
    # Secrets/Variables estão cadastrados no Environment do GitHub `prod`
    # (mesmo nome do branch que dispara o workflow) — sem esta declaração,
    # `secrets.*`/`vars.*` resolvem vazios para jobs fora desse environment.
    environment: prod
    steps:
      # Checkout necessário para resolver o composite local `./.github/jobs/...`.
      - name: Checkout repository
        uses: actions/checkout@v4

      # A URL de produção é centralizada no orquestrador e passada via `with:` —
      # nunca hardcoded no composite. O composite a recebe como input.
      - name: Run smoke-test composite
        uses: ./.github/jobs/smoke-test
        with:
          production-url: ${{ vars.NEXT_PUBLIC_APP_URL }}
